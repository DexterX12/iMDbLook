<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iMDbLook</title>
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script defer src="assets/js/main.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <video id="background-video" autoplay loop>
            <source src="" type="video/mp4">
        </video>
        <nav>
            <div class="app-logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/69/IMDB_Logo_2016.svg/2560px-IMDB_Logo_2016.svg.png" alt="iMDb logo">
            </div>
            <div class="profile-interaction">
                <div class="search-box">
                    <input type="text" id="movie-search" placeholder="Search something!">
                </div>
                <i class="fa-solid fa-magnifying-glass mag"></i>
                <div class="user-profile">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1f/Woman_1.jpg/768px-Woman_1.jpg" alt="Your profile picture">
                </div>
            </div>
        </nav>
        <div id="movie-big-screen">
            <h2 class="movie-big-title"></h2>
            <p class="movie-big-description"></p>
            <p class="movie-big-favorite">
                <i class="fa-regular fa-heart"></i>
                <i class="fa-solid fa-heart"></i>
            </p>
        </div>
    </header>
    <main>
        <h3>What's on iMDb currently</h3>
        <div class="movie-list">
            <div class="carousel-arrow" id="movie-carousel-left">
                <i class="fa-solid fa-chevron-left"></i>
            </div>
            <div class="carousel-arrow" id="movie-carousel-right">
                <i class="fa-solid fa-chevron-right"></i>
            </div>
            <div id="movie-carousel">
            </div>
        </div>
    </main>
    <footer>

    </footer>
</body>
</html>
